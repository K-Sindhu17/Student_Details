services:
  postgres:
    image: postgres:16-alpine
    container_name: student_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-student_db}
      POSTGRES_USER: ${DB_USER:-student_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-studentpass}
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-student_user} -d ${DB_NAME:-student_db}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - student_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: student_backend
    restart: unless-stopped
    environment:
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-student_user}
      DB_PASSWORD: ${DB_PASSWORD:-studentpass}
      DB_NAME: ${DB_NAME:-student_db}
      JWT_SECRET: ${JWT_SECRET:-zphsparmalla_dev_secret}
      SCHOOL_DOMAIN: ${SCHOOL_DOMAIN:-zphsparmalla.in}
      SCHOOL_NAME: ${SCHOOL_NAME:-ZPHS Parmalla}
    ports:
      - "5002:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - student_network

  seed:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: student_seed
    restart: "no"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-student_user}
      DB_PASSWORD: ${DB_PASSWORD:-studentpass}
      DB_NAME: ${DB_NAME:-student_db}
      SCHOOL_DOMAIN: ${SCHOOL_DOMAIN:-zphsparmalla.in}
    command: npm run seed
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - student_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: student_frontend
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      - backend
    networks:
      - student_network

volumes:
  pg_data:

networks:
  student_network:
    driver: bridge
