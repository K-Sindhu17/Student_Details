services:
  mysql:
    image: mysql:8.0
    container_name: student_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-student_db}
      MYSQL_USER: ${DB_USER:-student_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-studentpass}
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - student_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: student_backend
    restart: unless-stopped
    environment:
      PORT: 5000
      DB_HOST: mysql
      DB_USER: ${DB_USER:-student_user}
      DB_PASSWORD: ${DB_PASSWORD:-studentpass}
      DB_NAME: ${DB_NAME:-student_db}
    ports:
      - "5002:5000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - student_network

  seed:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: student_seed
    environment:
      DB_HOST: mysql
      DB_USER: ${DB_USER:-student_user}
      DB_PASSWORD: ${DB_PASSWORD:-studentpass}
      DB_NAME: ${DB_NAME:-student_db}
    command: npm run seed
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - student_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: student_frontend
    restart: unless-stopped
    ports:
      - "3001:3000"
    depends_on:
      - backend
    networks:
      - student_network

volumes:
  mysql_data:

networks:
  student_network:
    driver: bridge
