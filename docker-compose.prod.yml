services:
  mysql:
    image: mysql:8.0
    container_name: student_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-student_db}
      MYSQL_USER: ${DB_USER:-student_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-studentpass}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - student_network

  backend:
    image: ${DOCKERHUB_USERNAME}/student-backend:latest
    container_name: student_backend
    restart: unless-stopped
    environment:
      PORT: 5000
      DB_HOST: mysql
      DB_USER: ${DB_USER:-student_user}
      DB_PASSWORD: ${DB_PASSWORD:-studentpass}
      DB_NAME: ${DB_NAME:-student_db}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - student_network

  seed:
    image: ${DOCKERHUB_USERNAME}/student-backend:latest
    container_name: student_seed
    restart: "no"
    environment:
      DB_HOST: mysql
      DB_USER: ${DB_USER:-student_user}
      DB_PASSWORD: ${DB_PASSWORD:-studentpass}
      DB_NAME: ${DB_NAME:-student_db}
    command: npm run seed
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - student_network

  frontend:
    image: ${DOCKERHUB_USERNAME}/student-frontend:latest
    container_name: student_frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot_webroot:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    depends_on:
      - backend
    networks:
      - student_network

  certbot:
    image: certbot/certbot
    container_name: student_certbot
    volumes:
      - certbot_webroot:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    networks:
      - student_network

volumes:
  mysql_data:
  certbot_webroot:
  certbot_certs:

networks:
  student_network:
    driver: bridge
