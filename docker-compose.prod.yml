services:
  postgres:
    image: postgres:16-alpine
    container_name: student_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME:-student_db}
      POSTGRES_USER:     ${DB_USER:-student_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-studentpass}
    volumes:
      - pg_data:/var/lib/postgresql/data
      # init.sql runs only on first start (when the data dir is empty).
      # Subsequent starts read existing data and skip this.
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-student_user} -d ${DB_NAME:-student_db}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - student_network

  backend:
    image: ${DOCKERHUB_USERNAME}/student-backend:latest
    container_name: student_backend
    restart: unless-stopped
    environment:
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER:     ${DB_USER:-student_user}
      DB_PASSWORD: ${DB_PASSWORD:-studentpass}
      DB_NAME:     ${DB_NAME:-student_db}
      JWT_SECRET:     ${JWT_SECRET}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SCHOOL_DOMAIN:  ${SCHOOL_DOMAIN:-zphsparmalla.in}
      SCHOOL_CODE:    ${SCHOOL_CODE:-A61}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - student_network

  seed:
    image: ${DOCKERHUB_USERNAME}/student-backend:latest
    container_name: student_seed
    restart: "no"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER:     ${DB_USER:-student_user}
      DB_PASSWORD: ${DB_PASSWORD:-studentpass}
      DB_NAME:     ${DB_NAME:-student_db}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SCHOOL_DOMAIN:  ${SCHOOL_DOMAIN:-zphsparmalla.in}
      NODE_ENV: production
    command: npm run seed
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - student_network

  frontend:
    image: ${DOCKERHUB_USERNAME}/student-frontend:latest
    container_name: student_frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot_webroot:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    depends_on:
      - backend
    networks:
      - student_network

  portfolio:
    image: ${DOCKERHUB_USERNAME}/portfolio:latest
    container_name: portfolio
    restart: unless-stopped
    networks:
      - student_network

  certbot:
    image: certbot/certbot
    container_name: student_certbot
    volumes:
      - certbot_webroot:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    networks:
      - student_network

volumes:
  pg_data:
  certbot_webroot:
  certbot_certs:

networks:
  student_network:
    driver: bridge
