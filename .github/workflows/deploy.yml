name: Build & Deploy to EC2

on:
  push:
    branches: [main]

env:
  FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/student-frontend
  BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/student-backend

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key and deploy
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY_B64 }}" | base64 -d > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

          SSH_OPTS="-i ~/.ssh/ec2_key -o StrictHostKeyChecking=no"
          TARGET="${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}"

          # Copy files
          scp $SSH_OPTS docker-compose.prod.yml .env.production ${TARGET}:/home/${{ secrets.EC2_USERNAME }}/student-app/
          scp $SSH_OPTS database/init.sql ${TARGET}:/home/${{ secrets.EC2_USERNAME }}/student-app/database/

          # Deploy
          ssh $SSH_OPTS ${TARGET} "cd ~/student-app && \
            export DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }} && \
            export \$(cat .env.production | grep -v '^#' | xargs) && \
            docker compose -f docker-compose.prod.yml pull && \
            docker compose -f docker-compose.prod.yml down && \
            docker compose -f docker-compose.prod.yml up -d && \
            echo 'Waiting for services...' && sleep 10 && \
            curl -f http://localhost/api/health || echo 'Health check failed' && \
            docker image prune -f"
