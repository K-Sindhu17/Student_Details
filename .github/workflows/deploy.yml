name: Build & Deploy to EC2

on:
  push:
    branches: [main]

env:
  FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/student-frontend
  BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/student-backend

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH and Deploy
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USERNAME }}
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY_B64 }}" | base64 -d > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keygen -l -f ~/.ssh/ec2_key
          ssh-keyscan -H ${EC2_HOST} >> ~/.ssh/known_hosts 2>/dev/null

          SSH_CMD="ssh -o StrictHostKeyChecking=no -i ~/.ssh/ec2_key"
          SCP_CMD="scp -o StrictHostKeyChecking=no -i ~/.ssh/ec2_key"

          # Test SSH
          ${SSH_CMD} ${EC2_USER}@${EC2_HOST} "echo SSH_OK"

          # Create .env.production
          cat > .env.production << 'ENVEOF'
          DB_ROOT_PASSWORD=rootpassword
          DB_NAME=student_db
          DB_USER=student_user
          DB_PASSWORD=studentpass
          ENVEOF

          # Copy files
          ${SCP_CMD} docker-compose.prod.yml .env.production init-letsencrypt.sh \
            ${EC2_USER}@${EC2_HOST}:/home/${EC2_USER}/student-app/

          ${SSH_CMD} ${EC2_USER}@${EC2_HOST} "mkdir -p ~/student-app/frontend ~/student-app/database"

          ${SCP_CMD} frontend/nginx.conf frontend/nginx-init.conf \
            ${EC2_USER}@${EC2_HOST}:/home/${EC2_USER}/student-app/frontend/

          ${SCP_CMD} database/init.sql \
            ${EC2_USER}@${EC2_HOST}:/home/${EC2_USER}/student-app/database/

          # Deploy (including portfolio container)
          ${SSH_CMD} ${EC2_USER}@${EC2_HOST} "set -e; cd ~/student-app && \
            export DOCKERHUB_USERNAME=${DOCKER_USER} && \
            export \$(cat .env.production | grep -v '^#' | xargs) && \
            echo '--- disk before cleanup ---' && df -h / && \
            docker image prune -af && \
            docker builder prune -af && \
            echo '--- disk after cleanup ---' && df -h / && \
            docker compose -f docker-compose.prod.yml pull && \
            docker compose -f docker-compose.prod.yml up -d --force-recreate && \
            echo 'Waiting for services...' && sleep 10 && \
            docker compose -f docker-compose.prod.yml ps && \
            (curl -fsS http://localhost/api/health || echo 'Health check failed')"
