upstream backend_server {
    server backend:5000;
    keepalive 32;
}

# Redirect HTTP to HTTPS — main site
server {
    listen 80;
    server_name sindhu-kodaboina.com www.sindhu-kodaboina.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Redirect HTTP to HTTPS — portfolio subdomain
server {
    listen 80;
    server_name portfolio.sindhu-kodaboina.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — main site
server {
    listen 443 ssl;
    server_name sindhu-kodaboina.com www.sindhu-kodaboina.com;

    ssl_certificate /etc/letsencrypt/live/sindhu-kodaboina.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sindhu-kodaboina.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api {
        proxy_pass http://backend_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# HTTPS — portfolio subdomain
server {
    listen 443 ssl;
    server_name portfolio.sindhu-kodaboina.com;

    ssl_certificate /etc/letsencrypt/live/sindhu-kodaboina.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sindhu-kodaboina.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;

    location / {
        proxy_pass http://portfolio:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
